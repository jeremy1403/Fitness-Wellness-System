# ==============================================================================
# Fitness & Wellness Platform — Docker Compose
# Services: app (Laravel), frontend (Next.js), mysql, redis, mailpit
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Laravel Application (PHP-FPM + Nginx)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: fw-app
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fw-network

  # ----------------------------------------------------------------------------
  # Laravel Queue Worker (Redis-backed)
  # ----------------------------------------------------------------------------
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: fw-queue
    restart: unless-stopped
    env_file: ./backend/.env
    command: php artisan queue:work --tries=3 --backoff=5 --sleep=3 --timeout=60
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fw-network

  # ----------------------------------------------------------------------------
  # Next.js Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${APP_PORT:-8000}
    container_name: fw-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://app:80
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - app
    networks:
      - fw-network

  # ----------------------------------------------------------------------------
  # MySQL 8.0
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: fw-mysql
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fw-network

  # ----------------------------------------------------------------------------
  # Redis 7 (Cache, Sessions, Queues)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: fw-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fw-network

  # ----------------------------------------------------------------------------
  # Mailpit (Local email testing)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: fw-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "1025:1025"
    networks:
      - fw-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  vendor_data:
    driver: local

networks:
  fw-network:
    driver: bridge
